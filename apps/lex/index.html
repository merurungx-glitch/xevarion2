<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!-- ★ XEVARION II のアプリ：II の中（#/app/lex の iframe）でだけ動く。II の機能は親の window.X2（src/portal/bridge.js）だけを使う。
     直接開かれたら II の入口へ送る。初代の共通部品（xeva.js・xeva-cloud・xevarion-fb・SW・起動ロゴ・safebottom・xeva-tour など）は読まない -->
<script>
(function () {
  var P = null;
  try { P = window.parent !== window ? window.parent.X2 : null; } catch (e) { P = null; }
  if (!P) {
    if (window.parent === window) location.replace('../../index.html#/app/lex');
    throw new Error('MagiLex は XEVARION II の中で開いてください');
  }
  window.X2 = P;
  P.attach(window); /* 余白・動作モード・省電力のコマ数 */
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MagiLex — 難関化学の問題集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">

</head>
<body>
<!-- ══════════════════════════════════════════════════════════════
     MagiLex（XEVARION II）＝初代 MagiChemLex の中身（2026-10-06 新作 → 2026-11-23 XEVARION II へ移しかえ）
     ・決めたこと（2026-11-20・11-23 ご回答）：II の MagiLex の中身は MagiChemLex だけ。見た目は ChemLex のまま・名前だけ MagiLex。
       問題の置き場は MagiQuiz と分ける。追加の機能はケミカル・ルートとビンゴだけ（フラッシュカード・模試の冊子・特設予想問題・WP 交換所は入れない）。
     ・学習の記録は II のアカウントで同期（X2.appData・混ぜ方は core/merge.js の mergeLex）。XEVA などのごほうびは X2.earn で本人のお財布へ。
     ・ナビは ケミィ ＋ II のキャラ（持っている子）。★ 大学名・年度・学部名などの固有名詞は出さない（ChemLex の決まりのまま）。
     ══════════════════════════════════════════════════════════════ -->
<div id="app">

    <button data-a="tab" data-tab="tools"><svg class="di" viewBox="0 0 24 24" aria-hidden="true"><path class="b" d="M6.2 20.6h11.6a1.5 1.5 0 0 0 1.3-2.3L15.4 12H8.6l-3.7 6.3a1.5 1.5 0 0 0 1.3 2.3z"/><path class="f" d="M9 3h6M10 3v6.6l-5.4 9A2 2 0 0 0 6.3 21.6h11.4a2 2 0 0 0 1.7-3l-5.4-9V3"/><circle class="a" cx="10.6" cy="16.4" r="1.1"/><circle class="a" cx="13.9" cy="18.2" r=".8"/></svg>ツール</button>
  </nav>
</div>

<script>
  /* 字（Web フォント）がそろったら II のロード画面を消す（1.5 秒まで待つ） */
  (function () {
    var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    Promise.race([fonts, new Promise(function (r) { setTimeout(r, 1500); })]).then(function () {
      requestAnimationFrame(function () { X2.ready(); });
    });
  })();
</script>
